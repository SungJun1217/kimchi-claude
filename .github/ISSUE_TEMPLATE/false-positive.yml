name: "잘못 걸린 문장(오탐)"
description: "규칙이나 훅이 문제없는 문장을 잘못 지적한 경우 제보합니다."
labels: ["false-positive", "rules"]
body:
  - type: markdown
    attributes:
      value: |
        주민등록번호 등 개인정보가 포함된 문장이라면 실제 값 대신 가상의 값으로
        바꿔서 적어 주십시오(예: 900101-1234567).
  - type: textarea
    id: sentence
    attributes:
      label: 걸린 문장
      description: 규칙이나 훅이 지적한 원래 문장을 그대로 적어 주십시오.
      render: text
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 경고·교정 메시지
      description: 훅이나 스타일이 보여 준 경고 또는 교정 메시지를 그대로 붙여 주십시오.
      render: text
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 어디서
      options:
        - 커밋 메시지
        - 문서 파일
        - 대화 답변(스타일)
        - 기타
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 왜 틀렸다고 보나
      description: 이 문장이 왜 문제없다고 생각하는지 근거를 적어 주십시오.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: package.json 또는 plugin.json 에 적힌 버전입니다.
      placeholder: "0.16.6"
    validations:
      required: true
  - type: dropdown
    id: autofix
    attributes:
      label: KIMCHI_AUTOFIX 사용 여부
      options:
        - "사용함"
        - "사용하지 않음"
        - "모르겠음"
    validations:
      required: true

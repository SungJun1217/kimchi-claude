# 의존성이 없는 저장소라(package.json 에 dependencies 가 없다) npm 은 지켜볼 것이 없다.
# 올릴 대상은 워크플로가 쓰는 GitHub Actions(actions/checkout, actions/setup-node)뿐이다.
# 기능 브랜치와 같은 흐름을 타도록 develop 으로 PR 을 연다. main 은 릴리스 때만 바뀐다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

name: CodeQL

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # 매주 월요일 03:00 UTC — 코드가 조용히 있어도 새 쿼리팩이 나올 수 있다.
    - cron: "0 3 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 의존성이 없고 빌드 산출물도 없다 — 정적 분석만 하면 된다.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4

name: hook-latency

# 훅(hooks/**)·규칙(rules/**, 훅이 부팅 때 읽는다)·이 봇 자신(scripts/hook-latency.mjs,
# 이 워크플로 파일)이 바뀐 PR에서 scripts/hook-latency.mjs(오프라인)로 base→head 훅
# 지연 시간을 재서 sticky 코멘트와 워크플로 요약에 남긴다. package.json은 일부러 뺐다
# — 단위 커밋마다 버전이 올라가므로(AGENTS.md) 포함하면 훅과 무관한 PR마다 base=head인
# 의미 없는 A/A 비교가 돈다. rule-impact.yml과 같은 이유로 pull_request_target은 쓰지
# 않는다 — 신뢰할 수 없는 head 브랜치의 코드(스폰당하는 훅 스크립트 자신)를 쓰기
# 권한 토큰으로 실행하면 안 된다. 이 워크플로는 회귀를 경고만 한다(불변식 2·10과
# 같은 어투 — 막지 않고 알린다). 측정 자체가 실패해도(스크립트 크래시) job은 실패
# 시키지 않는다 — hook-latency.mjs 내부에서 이미 실패를 마커가 든 짧은 본문으로
# 바꿔 exit 0으로 끝낸다. job에는 그래도 timeout-minutes를 둔다 — 스크립트 자신의
# 스폰 타임아웃(15초, 그리고 head가 계속 멈춰 있으면 페이로드당 최대 한 번만 기다리는
# stopAfterFirstHeadTimeout)이 무한 루프 하나는 막아 주지만, 다른 원인으로 job 전체가
# 예상 밖으로 오래 걸리는 경우까지 GitHub Actions 기본 상한(6시간)에 맡기지 않는다.
# 스크립트 자체의 SCRIPT_DEADLINE_MS(8분)보다 여유 있게 15분으로 잡아, 그 상한이
# 페이로드를 잘라낸 뒤에도 결과 파일을 쓸 시간이 남게 한다.
on:
  pull_request:
    paths:
      - "hooks/**"
      - "rules/**"
      - "scripts/hook-latency.mjs"
      - ".github/workflows/hook-latency.yml"

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: hook-latency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hook-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: head 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: base 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 훅 지연 시간 측정
        run: |
          node head/scripts/hook-latency.mjs --base base --head head --out latency.md --json latency.json

      - name: 워크플로 요약에 기록
        run: cat latency.md >> "$GITHUB_STEP_SUMMARY"

      - name: 회귀에 경고를 남긴다
        run: |
          jq -r '.payloads[]? | select(.regression) |
            "::warning::훅 지연 시간 회귀 — \(.name): " +
            (.timeoutNote // ("base " + ((.base.medianMs // "?")|tostring) + "ms → head " + ((.head.medianMs // "?")|tostring) + "ms (" + ((.deltaPct // "?")|tostring) + "%)"))' \
            latency.json || true

      # fork에서 온 PR은 기본 토큰이 읽기 전용이라 코멘트 게시가 403으로 실패한다 —
      # 그 경우 위 요약만 남기고 이 단계부터는 건너뛴다.
      - name: 쓰기 권한 판정
        id: perm
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "can-write=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-write=false" >> "$GITHUB_OUTPUT"
            echo "fork PR이라 코멘트를 올리지 못합니다. 워크플로 요약만 남깁니다." >&2
          fi

      - name: 기존 kimchi 코멘트를 찾는다
        id: existing
        if: steps.perm.outputs.can-write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | test("kimchi-claude-hook-latency")) | .id' \
            > existing-ids.txt 2>/dev/null
          ID=$(tail -n 1 existing-ids.txt)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 코멘트를 올리거나 갱신한다
        if: steps.perm.outputs.can-write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ -n "${{ steps.existing.outputs.id }}" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${{ steps.existing.outputs.id }}" \
              -F body=@latency.md >/dev/null \
              || echo "::warning::hook-latency 코멘트 갱신에 실패했습니다." >&2
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -F body=@latency.md >/dev/null \
              || echo "::warning::hook-latency 코멘트 작성에 실패했습니다." >&2
          fi
          exit 0

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: package.json 과 plugin.json 버전이 태그와 맞는지 본다
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::태그($TAG)와 버전이 어긋난다 — package.json=$PKG_VERSION, plugin.json=$PLUGIN_VERSION"
            exit 1
          fi

      - run: npm test

      - name: 이전 태그부터 이번 태그까지의 버전 커밋으로 릴리스 노트를 만든다
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 릴리스 태그는 main 의 병합 커밋("merge: …")을 가리키고, 그 커밋 본문은
          # 비어 있다. 실제로 무엇이 바뀌었는지는 이전 태그부터 이번 태그까지의
          # 버전 커밋 제목들에 있다 — 그래서 태그 자체가 아니라 이 구간에서 노트를 뽑는다.
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            echo "이전 태그: $PREV_TAG"
            BODY=$(git log --no-merges --format='- %s' "${PREV_TAG}..${TAG}")
          else
            echo "이전 태그가 없다 — 전체 이력에서 뽑는다"
            BODY=$(git log --no-merges --format='- %s' "${TAG}")
          fi

          if [ -z "$BODY" ]; then
            BODY="(버전 커밋을 찾지 못했다)"
          fi

          {
            echo "body<<KIMCHI_RELEASE_NOTES_EOF"
            echo "$BODY"
            echo "KIMCHI_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release 를 만들거나, 이미 있으면 노트만 갱신한다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$BODY"
          else
            gh release create "$TAG" --title "$TAG" --notes "$BODY"
          fi

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: package.json 과 plugin.json 버전이 태그와 맞는지 본다
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::태그($TAG)와 버전이 어긋난다 — package.json=$PKG_VERSION, plugin.json=$PLUGIN_VERSION"
            exit 1
          fi

      - run: npm test

      - name: 이전 태그부터 이번 태그까지의 버전 커밋으로 릴리스 노트를 만든다
        id: notes
        run: |
          # 릴리스 태그는 main 의 병합 커밋("merge: …")을 가리키고, 그 커밋 본문은
          # 비어 있다. 실제로 무엇이 바뀌었는지는 이전 태그부터 이번 태그까지의
          # 버전 커밋 제목들에 있다 — 그래서 태그 자체가 아니라 이 구간에서 노트를 뽑는다.
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            echo "이전 태그: $PREV_TAG"
            RANGE="${PREV_TAG}..${TAG}"
          else
            echo "이전 태그가 없다 — 전체 이력에서 뽑는다"
            RANGE="${TAG}"
          fi

          # 버전 커밋("0.x.y — …")만 모은다. Dependabot 커밋("ci: bump …")처럼 버전 없이
          # 따라 들어온 커밋은 그 위의 버전 커밋이 이미 설명한다.
          BODY=$(git log --no-merges --format='%s' "$RANGE" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+ — ' | sed 's/^/- /' || true)

          if [ -z "$BODY" ]; then
            BODY="(버전 커밋을 찾지 못했다)"
          fi

          {
            echo "body<<KIMCHI_RELEASE_NOTES_EOF"
            echo "$BODY"
            echo "KIMCHI_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release 를 만들거나, 이미 있으면 노트만 갱신한다
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$BODY"
          else
            gh release create "$TAG" --title "$TAG" --notes "$BODY"
          fi

      # GitHub Action(action.yml)을 쓰는 쪽은 `uses: SungJun1217/kimchi-claude@v0` 처럼
      # 세부 버전 없이 메이저 태그를 참조하는 것이 관례다. 아직 1.0.0 이 아니라서(전부
      # 0.x) 메이저 태그가 없으면 그 관례를 못 따른다 — "v0" 을 이동 태그로 두고 릴리스마다
      # 이번 태그로 강제 이동시킨다. contents: write 권한은 위에서 이미 받았다.
      #
      # 두 가지를 지킨다. 메이저 버전이 0인 태그(v0.x.y)에만 옮긴다 — 언젠가 v1.0.0을
      # 내면 이 스텝이 v0를 계속 건드릴 이유가 없다(위 버전 일치 검사가 이미 그 태그를
      # 걸러 주지만, 이 스텝만 따로 읽어도 조건이 분명하도록 다시 확인한다). 그리고
      # 기존 v0가 있으면 이번 태그의 조상인지 본다 — 과거 버전을 뒤늦게 다시 릴리스하는
      # 경우(hotfix 태그를 옛 브랜치에 붙이는 등) v0가 최신 릴리스보다 뒤로 가면 안 된다.
      - name: 이동 태그 v0 를 이번 릴리스로 옮긴다
        run: |
          if [[ "$TAG" != v0.* ]]; then
            echo "메이저 버전이 0이 아니라(v0.* 형태가 아니라) v0 태그를 옮기지 않습니다: $TAG"
            exit 0
          fi

          if git rev-parse -q --verify refs/tags/v0 >/dev/null; then
            if git merge-base --is-ancestor v0 "$TAG"; then
              git tag -f v0 "$TAG"
              git push -f origin v0
            else
              echo "::notice::v0 태그가 가리키는 커밋이 이번 태그($TAG)의 조상이 아니라 옮기지 않습니다(과거 버전 재릴리스 등)."
            fi
          else
            git tag -f v0 "$TAG"
            git push -f origin v0
          fi

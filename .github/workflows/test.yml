name: test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # GITHUB_TOKEN으로 한 push는 새 workflow run을 만들지 않는다(GitHub의 의도된 동작 —
  # 재귀 실행 방지). pr-version.yml의 dependabot-bump job이 그 push 뒤에 이 이벤트로
  # 직접 재실행을 요청한다(gh workflow run test.yml --ref <branch>) — 그래야 필수 검사
  # (test, test-macos)가 그 커밋 SHA에 체크런으로 다시 붙는다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["22", "24"]
        include:
          # 개발자 대부분이 macOS 를 쓴다. 시험은 5~15초라 러너 비용이 적고, macOS 고유의
          # 경로·파일시스템 가정(예: FIFO 처리)이 깨지는 것을 여기서만 잡을 수 있다.
          #
          # 검사 이름(name:)을 "test-macos"로 고정한다 — 이 이름이 main 브랜치
          # 규칙(ruleset)에 필수 검사로 등록돼 있다. 이름이 달라지면 규칙도 함께 고쳐야 한다.
          - os: macos-latest
            node-version: "24"
            name: test-macos
    name: ${{ matrix.name || format('test ({0})', matrix.node-version) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/repo-language.test.mjs reads this repo's own commit history
          # (git log 로 커밋 제목을 읽는다) — 얕은 클론이면 표본이 부족해 판정이 흔들린다.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # 의존성이 없다 — npm install/ci 는 필요 없다.
      - run: npm test

<rect x="0.5" y="0.5" width="1039" height="439" rx="16" fill="#1A1513" stroke="#3A2F2A"/><path d="M0.5 16.5 a16 16 0 0 1 16 -16 h1007 a16 16 0 0 1 16 16 v25 h-1039 z" fill="#241D1A" stroke="#3A2F2A"/><line x1="0" y1="42" x2="1040" y2="42" stroke="#3A2F2A"/><circle cx="24" cy="21" r="6" fill="#FF5F57"/><circle cx="44" cy="21" r="6" fill="#FEBC2E"/><circle cx="64" cy="21" r="6" fill="#28C840"/><text x="520" y="26" text-anchor="middle" class="mono" font-size="12.5" fill="#9C8B7F">~/shop-api — claude  ·  kimchi-claude hooks</text><text x="32" y="82" class="mono f0" font-size="14.5"><tspan fill="#FF8A5B">● </tspan><tspan fill="#EFE5DC" font-weight="700">SessionStart</tspan><tspan fill="#9C8B7F">  ·  영어 이력 저장소에서 새 세션</tspan></text><g class="f1"><text x="40" y="112" class="mono" font-size="14.5" fill="#9C8B7F">⎿</text><rect x="64" y="95" width="54" height="24" rx="12" fill="#1B2C45"/><text x="91" y="112" text-anchor="middle" class="sans" font-size="13" font-weight="800" fill="#8DB8F0">안내</text><text x="132" y="112" class="sans" font-size="15" fill="#EFE5DC">커밋 메시지와 PR 설명은 영어로 씁니다. 이 저장소의 이력이 영어입니다.</text></g><text x="32" y="154" class="mono f2" font-size="14.5"><tspan fill="#FF8A5B">● </tspan><tspan fill="#EFE5DC" font-weight="700">Write(docs/users.md)</tspan><tspan fill="#9C8B7F">  ·  주민등록번호가 든 회원 명단</tspan></text><g class="f3"><text x="40" y="184" class="mono" font-size="14.5" fill="#9C8B7F">⎿</text><rect x="64" y="167" width="54" height="24" rx="12" fill="#4A231F"/><text x="91" y="184" text-anchor="middle" class="sans" font-size="13" font-weight="800" fill="#FF7B6B">차단</text><text x="132" y="184" class="sans" font-size="15" fill="#EFE5DC">docs/users.md에서 주민등록번호로 보이는 값 1건을 찾았습니다.</text></g><text x="132" y="212" class="mono f4" font-size="13" fill="#9C8B7F">1번째 줄 5칸: 900101-*******  —  저장소에 남으면 커밋을 지워도 사라지지 않습니다</text><text x="32" y="250" class="mono f5" font-size="14.5"><tspan fill="#FF8A5B">● </tspan><tspan fill="#EFE5DC" font-weight="700">Bash(git commit -m "리팩토링 후 디플로이 이슈를 핸들링했습니다")</tspan><tspan fill="#9C8B7F"></tspan></text><g class="f6"><text x="40" y="280" class="mono" font-size="14.5" fill="#9C8B7F">⎿</text><rect x="64" y="263" width="54" height="24" rx="12" fill="#45300F"/><text x="91" y="280" text-anchor="middle" class="sans" font-size="13" font-weight="800" fill="#F2B05E">경고</text><text x="132" y="280" class="sans" font-size="15" fill="#EFE5DC">커밋 메시지에서 어색한 한국어 표현 3건을 찾았습니다.</text></g><text x="132" y="308" class="sans f7" font-size="14.5"><tspan fill="#FF7B6B" text-decoration="line-through">리팩토링</tspan><tspan fill="#9C8B7F">  →  </tspan><tspan fill="#7FD18F" font-weight="700">리팩터링</tspan><tspan fill="#9C8B7F" font-size="13">    외래어 표기법</tspan></text><text x="132" y="332" class="sans f8" font-size="14.5"><tspan fill="#FF7B6B" text-decoration="line-through">디플로이</tspan><tspan fill="#9C8B7F">  →  </tspan><tspan fill="#7FD18F" font-weight="700">배포</tspan><tspan fill="#9C8B7F" font-size="13">    이 자리는 한자어가 표준</tspan></text><text x="132" y="356" class="sans f9" font-size="14.5"><tspan fill="#FF7B6B" text-decoration="line-through">핸들링</tspan><tspan fill="#9C8B7F">  →  </tspan><tspan fill="#7FD18F" font-weight="700">처리</tspan><tspan fill="#9C8B7F" font-size="13">    예외 처리·오류 처리가 표준</tspan></text><g class="f10"><rect x="760" y="300" width="248" height="112" rx="12" fill="#211B18" stroke="#3A2F2A"/><text x="780" y="328" class="sans" font-size="13" fill="#9C8B7F">기본값</text><circle cx="786" cy="350" r="5" fill="#FF7B6B"/><text x="800" y="355" class="sans" font-size="13.5" fill="#EFE5DC">개인정보 → 막는다</text><circle cx="786" cy="374" r="5" fill="#F2B05E"/><text x="800" y="379" class="sans" font-size="13.5" fill="#EFE5DC">말투 → 알려만 준다</text><circle cx="786" cy="398" r="5" fill="#8DB8F0"/><text x="800" y="403" class="sans" font-size="13.5" fill="#EFE5DC">저장소 언어 → 한 번 안내</text></g>

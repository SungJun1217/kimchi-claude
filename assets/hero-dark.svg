<rect x="0.5" y="0.5" width="1039" height="499" rx="16" fill="#1A1513" stroke="#3A2F2A"/><path d="M0.5 16.5 a16 16 0 0 1 16 -16 h1007 a16 16 0 0 1 16 16 v25 h-1039 z" fill="#241D1A" stroke="#3A2F2A"/><line x1="0" y1="42" x2="1040" y2="42" stroke="#3A2F2A"/><circle cx="24" cy="21" r="6" fill="#FF5F57"/><circle cx="44" cy="21" r="6" fill="#FEBC2E"/><circle cx="64" cy="21" r="6" fill="#28C840"/><text x="520" y="26" text-anchor="middle" class="mono" font-size="12.5" fill="#9C8B7F">~/shop-api — claude</text><text x="32" y="80" class="sans f0" font-size="16" fill="#EFE5DC"><tspan class="mono" fill="#FF8A5B" font-weight="700">❯ </tspan>리뷰에 <tspan class="mono" fill="#8DB8F0">“keep the contract between these two modules thin”</tspan>이라고 달렸어. 무슨 뜻이야?</text><g class="f1"><rect x="32" y="112" width="476" height="318" rx="12" fill="#211B18" stroke="#3A2F2A"/><rect x="52" y="130" width="102.96" height="26" rx="13" fill="#4A231F"/><text x="65" y="148" class="mono" font-size="13" font-weight="700" fill="#FF7B6B">플러그인 없이</text><text x="488" y="148" text-anchor="end" class="sans" font-size="12.5" fill="#9C8B7F">직역한 은유가 그대로</text></g><text x="54" y="190" class="sans f2" font-size="15" fill="#EFE5DC">두 모듈이 서로 주고받는 인터페이스(공개 API)</text><text x="54" y="213" class="sans f3" font-size="15" fill="#EFE5DC">면적을 최소로 유지하라는 뜻입니다. …</text><text x="54" y="236" class="sans f4" font-size="15" fill="#EFE5DC"><tspan class="bad">계약이 얇으면</tspan> 한 모듈을 고칠 때 다른 모듈을</text><text x="54" y="259" class="sans f5" font-size="15" fill="#EFE5DC">함께 수정할 일이 거의 없어져서, 각자</text><text x="54" y="282" class="sans f6" font-size="15" fill="#EFE5DC">독립적으로 바꾸고 테스트할 수 있습니다.</text><text x="54" y="328" class="sans f8" font-size="15" fill="#EFE5DC">• <tspan class="bad">계약이 두꺼워지는</tspan> 전형적 신호: 공개 함수가</text><text x="54" y="351" class="sans f9" font-size="15" fill="#EFE5DC">   계속 늘어난다 …</text><text x="54" y="374" class="sans f10" font-size="15" fill="#EFE5DC">• 답이 한두 곳이면 <tspan class="bad">계약이 얇은</tspan> 것입니다.</text><g class="f11"><rect x="532" y="112" width="476" height="318" rx="12" fill="#211B18" stroke="#3A2F2A"/><rect x="552" y="130" width="127.39999999999998" height="26" rx="13" fill="#1D3A25"/><text x="565" y="148" class="mono" font-size="13" font-weight="700" fill="#7FD18F">kimchi-claude</text><text x="988" y="148" text-anchor="end" class="sans" font-size="12.5" fill="#9C8B7F">정착된 기술 용어로</text></g><text x="554" y="190" class="sans f12" font-size="15" fill="#EFE5DC">두 모듈이 서로 알아야 하는 규약, 즉</text><text x="554" y="213" class="sans f13" font-size="15" fill="#EFE5DC"><tspan class="good">공개 인터페이스</tspan>를 최소로 줄이라는 뜻입니다.</text><text x="554" y="236" class="sans f14" font-size="15" fill="#EFE5DC">지금은 한쪽이 상대의 내부 구조나 자료 형식까지</text><text x="554" y="259" class="sans f15" font-size="15" fill="#EFE5DC">알고 있어서 <tspan class="good">결합도</tspan>가 높다고 본 것으로 보입니다.</text><text x="554" y="282" class="sans f16" font-size="15" fill="#EFE5DC">공개하는 함수와 타입을 줄이고 내부 구현을 감추면,</text><text x="554" y="305" class="sans f17" font-size="15" fill="#EFE5DC">한쪽을 고칠 때 <tspan class="good">영향 범위</tspan>가 상대 모듈까지</text><text x="554" y="328" class="sans f18" font-size="15" fill="#EFE5DC">번지지 않습니다.</text><text x="554" y="374" class="sans f20" font-size="15" fill="#EFE5DC">• contract는 여기서 법적 계약이 아니라</text><text x="554" y="397" class="sans f21" font-size="15" fill="#EFE5DC">   규약·인터페이스를 가리킵니다.</text><g class="f11"><circle cx="520" cy="271" r="17" fill="#FF8A5B"/><path d="M514 271 h11 m-5 -5 l5 5 l-5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="f22"><rect x="32" y="444" width="476" height="34" rx="10" fill="#4A231F"/><text x="270" y="466" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#FF7B6B">린터 4건 · 한글 1000자당 9.6건</text></g><g class="f23"><rect x="532" y="444" width="476" height="34" rx="10" fill="#1D3A25"/><text x="770" y="466" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#7FD18F">린터 0건 · 분석 깊이는 그대로</text></g>
</svg>

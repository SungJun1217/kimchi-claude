<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="플러그인의 두 층. 왼쪽은 항상 켜진 말투 층으로 규칙표가 출력 스타일로 생성되어 시스템 프롬프트에 들어가고 훅이 산출물을 검사한다. 오른쪽은 필요할 때 여는 한국 개발 지식 스킬 다섯 개다">
<style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}text{white-space:pre}@keyframes dash{to{stroke-dashoffset:-22}}.flow{animation:dash 1.1s linear infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){[class^=f],[class*=' f']{animation:none!important;opacity:1!important;transform:none!important}.cursor,.pulse{animation:none!important}}</style>
<rect x="24" y="24" width="640" height="372" rx="12" fill="#FCE4DF" stroke="#C8372D"/><text x="46" y="58" class="sans" font-size="17" font-weight="800" fill="#C8372D">항상 켜짐 — 말투</text><text x="46" y="80" class="sans" font-size="13" fill="#2B2320">매 문장에 적용돼야 하니 모델의 판단에 맡기지 않는다</text><rect x="46" y="104" width="180" height="58" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><text x="62" y="129" class="mono" font-size="13.5" font-weight="700" fill="#2B2320">rules/*.md</text><text x="62" y="149" class="sans" font-size="12.5" fill="#9A8A7E">사람이 읽는 규칙표</text><line x1="226" y1="133" x2="256" y2="133" stroke="#C8372D" stroke-width="2" stroke-dasharray="6 5" class="flow"/><path d="M249 128 L256 133 L249 138" stroke="#C8372D" stroke-width="2" fill="none"/><rect x="258" y="104" width="170" height="58" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><text x="274" y="129" class="mono" font-size="13.5" font-weight="700" fill="#2B2320">build-style.mjs</text><text x="274" y="149" class="sans" font-size="12.5" fill="#9A8A7E">순위대로 상한까지</text><line x1="428" y1="133" x2="458" y2="133" stroke="#C8372D" stroke-width="2" stroke-dasharray="6 5" class="flow"/><path d="M451 128 L458 133 L451 138" stroke="#C8372D" stroke-width="2" fill="none"/><rect x="460" y="104" width="186" height="58" rx="12" fill="#FFFFFF" stroke="#C8372D"/><text x="476" y="129" class="mono" font-size="13.5" font-weight="700" fill="#2B2320">natural-korean.md</text><text x="476" y="149" class="sans" font-size="12.5" fill="#9A8A7E">생성된 출력 스타일</text><line x1="553" y1="162" x2="553" y2="196" stroke="#C8372D" stroke-width="2" stroke-dasharray="6 5" class="flow"/><path d="M546 191 L553 196 L546 201" stroke="#C8372D" stroke-width="2" fill="none"/><rect x="400" y="198" width="246" height="64" rx="12" fill="#FFFFFF" stroke="#C8372D"/><text x="523" y="225" text-anchor="middle" class="sans" font-size="14.5" font-weight="800" fill="#C8372D">시스템 프롬프트</text><text x="523" y="246" text-anchor="middle" class="mono" font-size="12" fill="#9A8A7E">force-for-plugin · 압축돼도 남는다</text><rect x="46" y="198" width="330" height="58" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><text x="62" y="223" class="mono" font-size="13.5" font-weight="700" fill="#2B2320">hooks/guard.mjs</text><text x="62" y="243" class="sans" font-size="12.5" fill="#9A8A7E">모든 Bash·Write·Edit 호출 · 약 80ms</text><rect x="46" y="284" width="140.32" height="28" rx="14" fill="#FFFFFF" stroke="#C8372D"/><text x="116.16" y="303" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#C8372D">주민등록번호 → 차단</text><rect x="196.32" y="284" width="91.44" height="28" rx="14" fill="#FFFFFF" stroke="#B8660F"/><text x="242.04" y="303" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#B8660F">말투 → 경고</text><rect x="297.76" y="284" width="182.95999999999998" height="28" rx="14" fill="#FFFFFF" stroke="#9A8A7E"/><text x="389.24" y="303" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#9A8A7E">코드 · 식별자 → 손대지 않음</text><rect x="46" y="326" width="330" height="58" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><text x="62" y="351" class="mono" font-size="13.5" font-weight="700" fill="#2B2320">hooks/session-language.mjs</text><text x="62" y="371" class="sans" font-size="12.5" fill="#9A8A7E">이력이 분명히 영어일 때만 한 번 안내</text><text x="400" y="352" class="sans" font-size="12.5" fill="#9A8A7E">의존성 0 · LLM 호출 0</text><text x="400" y="372" class="sans" font-size="12.5" fill="#9A8A7E">실패하면 조용히 비켜난다</text><rect x="684" y="24" width="332" height="372" rx="12" fill="#DFF2E3" stroke="#2F8A45"/><text x="706" y="58" class="sans" font-size="17" font-weight="800" fill="#2F8A45">필요할 때 — 지식</text><text x="706" y="80" class="sans" font-size="13" fill="#2B2320">그 일을 할 때만 열린다 · 동작하는 코드 포함</text><rect x="706" y="100" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><circle cx="724" cy="124" r="5" fill="#2F8A45" class="pulse" style="animation-delay:0s"/><text x="738" y="121" class="mono" font-size="13" font-weight="700" fill="#2B2320">korean-encoding</text><text x="738" y="139" class="sans" font-size="12" fill="#9A8A7E">CP949 · BOM · NFC/NFD · 초성</text><rect x="706" y="157" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><circle cx="724" cy="181" r="5" fill="#2F8A45" class="pulse" style="animation-delay:0.4s"/><text x="738" y="178" class="mono" font-size="13" font-weight="700" fill="#2B2320">korean-datetime</text><text x="738" y="196" class="sans" font-size="12" fill="#9A8A7E">공휴일 · 음력 · KST · 만 나이</text><rect x="706" y="214" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><circle cx="724" cy="238" r="5" fill="#2F8A45" class="pulse" style="animation-delay:0.8s"/><text x="738" y="235" class="mono" font-size="13" font-weight="700" fill="#2B2320">korean-identifiers</text><text x="738" y="253" class="sans" font-size="12" fill="#9A8A7E">주민번호 · 사업자번호 · 마스킹</text><rect x="706" y="271" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><circle cx="724" cy="295" r="5" fill="#2F8A45" class="pulse" style="animation-delay:1.2000000000000002s"/><text x="738" y="292" class="mono" font-size="13" font-weight="700" fill="#2B2320">korean-formats</text><text x="738" y="310" class="sans" font-size="12" fill="#9A8A7E">주소 · 전화번호 · 이름</text><rect x="706" y="328" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#EFE2D4"/><circle cx="724" cy="352" r="5" fill="#2F8A45" class="pulse" style="animation-delay:1.6s"/><text x="738" y="349" class="mono" font-size="13" font-weight="700" fill="#2B2320">natural-korean-writing</text><text x="738" y="367" class="sans" font-size="12" fill="#9A8A7E">규칙표 전체 · 글 검토</text>
</svg>
